name: Render CV preview

on:
  push:
    branches: [main]
    paths:
      - fwh_resume.pdf

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Render PDF to PNG
        run: pdftocairo -png -r 200 -singlefile fwh_resume.pdf cv
      - name: Commit preview if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.png
          git diff --cached --quiet || (git commit -m "Re-render CV preview" && git push)
